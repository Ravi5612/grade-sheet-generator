<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTU Grade Sheet Generator</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 20px; }
  .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  h1 { text-align: center; color: #8B0000; margin-bottom: 20px; }
  .form-group { margin-bottom: 15px; }
  label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px; }
  input[type="text"], input[type="number"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
  .row { display: flex; gap: 15px; }
  .row .form-group { flex: 1; }
  
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
  th { background: #f9f9f9; }
  input.cell-input { width: 100%; border: none; outline: none; text-align: center; font-size: 14px; background: transparent; }
  
  .btn { display: block; width: 100%; padding: 12px; background: #8B0000; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 20px; }
  .btn:hover { background: #a00000; }
  .add-row-btn { background: #0066cc; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; margin-top: 10px; font-size: 13px; }
</style>
</head>
<body>

<div class="container">
  <h1>PTU Grade Sheet Generator</h1>
  <form id="marksheetForm">
    
    <div class="row">
      <div class="form-group">
        <label>Student Name</label>
        <input type="text" id="name" required value="RAVI RAI">
      </div>
      <div class="form-group">
        <label>Roll Number</label>
        <input type="text" id="roll" required value="2130733">
      </div>
    </div>
    
    <div class="row">
      <div class="form-group">
        <label>Father's Name</label>
        <input type="text" id="fname" required value="UMESH RAI">
      </div>
      <div class="form-group">
        <label>Mother's Name</label>
        <input type="text" id="mname" required value="ANJU DEVI">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>S.No. of EDP</label>
        <input type="text" id="edp" required value="1002785552">
      </div>
      <div class="form-group">
        <label>College/Institute Name</label>
        <input type="text" id="college" required value="Gulzar Group of Institutes, Khanna, Ludhiana">
      </div>
    </div>
    
    <div class="row">
      <div class="form-group">
        <label>Branch & Course</label>
        <input type="text" id="branch" required value="Bachelor of Technology (Computer Science & Engineering)">
      </div>
      <div class="form-group">
        <label>Semester (e.g. 5th)</label>
        <input type="text" id="sem" required value="FOURTH">
      </div>
      <div class="form-group">
        <label>Session (e.g. April-2025)</label>
        <input type="text" id="session" required value="April-2025">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Notification Result Date</label>
        <input type="text" id="result_date" required value="01.08.2025">
      </div>
      <div class="form-group">
        <label>SGPA</label>
        <input type="text" id="sgpa" required value="6.29">
      </div>
      <div class="form-group">
        <label>Total Credits</label>
        <input type="text" id="credits" required value="21">
      </div>
    </div>

    <h3>Subjects & Grades</h3>
    <table id="subjectsTable">
      <thead>
        <tr>
          <th>Subject Code</th>
          <th>Subject Name</th>
          <th>Type</th>
          <th>Credits</th>
          <th>Grade</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="subjectsBody">
        <tr>
          <td><input type="text" class="cell-input code" value="BTCS-401-18"></td>
          <td><input type="text" class="cell-input name" value="Discrete Mathematics" style="text-align:left;"></td>
          <td><input type="text" class="cell-input type" value="Theory"></td>
          <td><input type="text" class="cell-input cred" value="4"></td>
          <td><input type="text" class="cell-input grade" value="P"></td>
          <td><button type="button" onclick="this.parentElement.parentElement.remove()">X</button></td>
        </tr>
      </tbody>
    </table>
    <button type="button" class="add-row-btn" onclick="addRow()">+ Add Subject</button>

    <button type="submit" class="btn">Generate Grade Sheet</button>
  </form>
</div>

<script>
  function addRow() {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" class="cell-input code"></td>
      <td><input type="text" class="cell-input name" style="text-align:left;"></td>
      <td><input type="text" class="cell-input type" value="Theory"></td>
      <td><input type="text" class="cell-input cred"></td>
      <td><input type="text" class="cell-input grade"></td>
      <td><button type="button" onclick="this.parentElement.parentElement.remove()">X</button></td>
    `;
    document.getElementById('subjectsBody').appendChild(tr);
  }

  document.getElementById('marksheetForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    // Collect data
    const data = {
      name: document.getElementById('name').value,
      roll: document.getElementById('roll').value,
      fname: document.getElementById('fname').value,
      mname: document.getElementById('mname').value,
      edp: document.getElementById('edp').value,
      college: document.getElementById('college').value,
      branch: document.getElementById('branch').value,
      sem: document.getElementById('sem').value,
      session: document.getElementById('session').value,
      result_date: document.getElementById('result_date').value,
      sgpa: document.getElementById('sgpa').value,
      credits: document.getElementById('credits').value,
      subjects: []
    };

    const rows = document.querySelectorAll('#subjectsBody tr');
    rows.forEach(row => {
      data.subjects.push({
        c: row.querySelector('.code').value,
        n: row.querySelector('.name').value,
        t: row.querySelector('.type').value,
        cr: row.querySelector('.cred').value,
        g: row.querySelector('.grade').value
      });
    });

    // Encode to base64 to pass via URL safely
    const encoded = btoa(JSON.stringify(data));
    window.location.href = 'certificate.html?data=' + encoded;
  });
</script>

</body>
</html>
